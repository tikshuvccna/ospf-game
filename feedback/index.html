<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>משוב בטא</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#121a35;--panel2:#1a2547;--panel3:#222f5a;--text:#e8ecff;--muted:#9aa7d6;--line:#2b3a6e;--cyan:#22d3ee;--pink:#ff4fa3;--amber:#fbbf24;--green:#34d399;--red:#fb7185;--violet:#a78bfa;--font:'Heebo','Segoe UI',system-ui,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--text);background:radial-gradient(1200px 700px at 80% -10%,#1d2b63 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#3a1b57 0%,transparent 55%),var(--bg);min-height:100vh;line-height:1.55}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
button{font-family:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:820px;margin:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:17px;letter-spacing:.3px}.logo small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.sp{flex:1}.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
.xp{height:14px;border-radius:99px;background:#0a1024;border:1px solid var(--line);overflow:hidden;position:relative}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));transition:width .45s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 12px var(--cyan)}
#xptext{font-size:12px;color:var(--muted);text-align:center}
#dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dt{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;padding:0;opacity:.5;transition:.2s}
.dt.past{opacity:.9;border-color:var(--green)}.dt.on{opacity:1;border-color:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.6);transform:scale(1.12)}
main{max-width:820px;margin:auto;padding:18px 16px 120px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.45);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ch{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.cicon{font-size:38px;filter:drop-shadow(0 0 12px rgba(34,211,238,.5))}
h1{font-size:30px;line-height:1.2;margin:10px 0}h2{margin:0;font-size:24px}
.grad{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub,.lead{color:var(--muted);margin:2px 0}.lead{font-size:17px;color:#cfd8ff}
.q{padding:14px 0;border-top:1px dashed rgba(255,255,255,.1)}.q:first-of-type{border-top:0}
.ql{font-weight:700;font-size:16px;margin-bottom:8px}.qh{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.tight{gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-size:14px;transition:.15s;font-weight:500}
.chip.sm{padding:5px 10px;font-size:12.5px}
.chip:hover{border-color:var(--cyan);transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,rgba(34,211,238,.28),rgba(167,139,250,.28));border-color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.35);font-weight:700}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}
.star{border:0;background:none;font-size:36px;color:#2b3a6e;padding:0 2px;transition:.15s;line-height:1}
.star.on{color:var(--amber);text-shadow:0 0 14px rgba(251,191,36,.7)}.star:hover{transform:scale(1.15)}
.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.5) rotate(10deg)}}
.scale{display:flex;align-items:center;gap:10px}.srow,.nrow{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.end{font-size:12px;color:var(--muted);max-width:90px;text-align:center}
.dot{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:16px;transition:.15s}
.dot.sm{width:34px;height:34px;font-size:13px}.dot:hover{border-color:var(--cyan)}
.dot.on{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#001018;border-color:#fff;box-shadow:0 0 14px rgba(34,211,238,.6)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.inp{width:100%;background:#0a1024;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;resize:vertical}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.mrow{padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}.mlabel{font-size:14px;font-weight:600;margin-bottom:4px}
.btn{border:1px solid var(--line);background:var(--panel3);border-radius:12px;padding:10px 20px;font-size:16px;font-weight:700;text-decoration:none;display:inline-block;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:linear-gradient(135deg,#0ea5c6,#7c5cff);border-color:#9be8ff;box-shadow:0 6px 22px rgba(34,211,238,.35)}
.btn.ghost{background:transparent}.btn.big{font-size:19px;padding:14px 30px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.skip{font-size:12px;color:var(--muted);text-align:center}
.row.c{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hero{text-align:center}
.media{border-radius:16px;overflow:hidden;margin:10px auto;background:#0a1024;border:1px solid var(--line)}
.media img,.media video{display:block;width:100%;height:auto}
.herom{max-height:300px}.herom img{max-height:300px;object-fit:cover}.midm{margin-top:14px}.midm img{max-height:220px;object-fit:cover}
.vid{max-width:560px}.gifm{width:140px;margin:0}
.ph{padding:22px;color:var(--muted);font-size:13px;background:repeating-linear-gradient(45deg,#0d1530,#0d1530 12px,#0f1838 12px,#0f1838 24px)}.phe{font-size:44px;animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.perk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px}.perk b{font-size:24px}
.stage{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--panel)}.stage.done{border-color:var(--green)}.stage.open{border-color:var(--cyan);box-shadow:0 0 18px rgba(34,211,238,.18)}
.sh{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px;text-align:right}
.si{font-size:28px}.stt{flex:1;display:flex;flex-direction:column}.stt small{color:var(--muted)}.sd{color:var(--green);font-weight:800}
.sb{padding:0 14px 14px}.sb .q{padding:10px 0}
.bug{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.bugh{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:none;color:var(--red);font-size:18px}
#cheer{position:fixed;bottom:18px;left:50%;transform:translate(-50%,160%);transition:.5s cubic-bezier(.3,1.4,.5,1);background:linear-gradient(135deg,#1b2a66,#3a1b57);border:1px solid var(--cyan);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:50;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(34,211,238,.35)}
#cheer.show{transform:translate(-50%,0)}.ct{font-weight:700;font-size:15px}
.gifm{border-radius:12px}
.toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--cyan);padding:8px 16px;border-radius:99px;z-index:60;animation:in .3s}
.status{margin-top:14px;text-align:center;font-size:15px;color:var(--muted)}.status.ok{color:var(--green);font-size:17px}.status.err{color:var(--amber)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media(max-width:560px){h1{font-size:24px}.dot{width:40px;height:40px}.scale{flex-direction:column}.chip{padding:8px 12px}.hin{padding:8px 12px}.star{font-size:32px}.dt{width:27px;height:27px;font-size:13px}#dots{gap:4px}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="top"><div class="logo"><span id="gname"></span><small>משוב בטא · <span id="mode">הצוות המעצב</span></small></div><div class="sp"></div><a id="back" class="pill" href="../">🎮 למשחק</a></div>
  <div class="xp"><div id="xpfill"></div></div><div id="xptext"></div>
  <div id="dots"></div>
</div></header>
<main><div id="step"></div><div id="status2"></div></main>
<div id="cheer"></div>
<canvas id="confetti"></canvas>
<script src="../js/firebase-config.js"></script>
<script src="config.js"></script>
<script src="form.js"></script>
</body>
</html>
